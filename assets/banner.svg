<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Rafi Adli Pradiansyah — builds internal web apps, PWAs, data sync, and WhatsApp AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#93c5fd"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f81f7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <clipPath id="type0"><rect x="104" y="202" height="36" width="0">
      <animate attributeName="width" values="0;446.4;446.4;0;0" keyTimes="0;0.0800;0.1600;0.1850;1" dur="20s" begin="0s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type1"><rect x="104" y="202" height="36" width="0">
      <animate attributeName="width" values="0;518.4;518.4;0;0" keyTimes="0;0.0800;0.1600;0.1850;1" dur="20s" begin="4s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="104" y="202" height="36" width="0">
      <animate attributeName="width" values="0;460.8;460.8;0;0" keyTimes="0;0.0800;0.1600;0.1850;1" dur="20s" begin="8s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type3"><rect x="104" y="202" height="36" width="0">
      <animate attributeName="width" values="0;403.2;403.2;0;0" keyTimes="0;0.0800;0.1600;0.1850;1" dur="20s" begin="12s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type4"><rect x="104" y="202" height="36" width="0">
      <animate attributeName="width" values="0;432.0;432.0;0;0" keyTimes="0;0.0800;0.1600;0.1850;1" dur="20s" begin="16s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.45"/>
    <circle cx="820" cy="60" r="170" fill="#2f81f7" opacity="0.35" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-60 40;0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="280" r="150" fill="#22d3ee" opacity="0.22" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;50 -30;0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="330" r="140" fill="#6366f1" opacity="0.18" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;40 -20;0 0" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
    <text x="70" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="4" fill="#7dd3fc">HI THERE, I'M</text>
    <text x="68" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#name)">Rafi Adli Pradiansyah</text>
  </g>
  <text x="70" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="700" fill="#22d3ee">$</text>
  <text x="104" y="228" clip-path="url(#type0)" textLength="446.4" lengthAdjust="spacingAndGlyphs" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#e5e7eb">building Laravel &amp; Next.js apps</text><text x="104" y="228" clip-path="url(#type1)" textLength="518.4" lengthAdjust="spacingAndGlyphs" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#e5e7eb">shipping PWAs for the workshop floor</text><text x="104" y="228" clip-path="url(#type2)" textLength="460.8" lengthAdjust="spacingAndGlyphs" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#e5e7eb">syncing legacy data into the web</text><text x="104" y="228" clip-path="url(#type3)" textLength="403.2" lengthAdjust="spacingAndGlyphs" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#e5e7eb">wiring WhatsApp to AI agents</text><text x="104" y="228" clip-path="url(#type4)" textLength="432.0" lengthAdjust="spacingAndGlyphs" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#e5e7eb">automating the repetitive work</text>
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
      <rect x="104" y="206" width="12" height="28" rx="2" fill="#22d3ee" opacity="0">
        <animate attributeName="x" values="104;554.4;554.4;104;104" keyTimes="0;0.0800;0.1600;0.1850;1" dur="20s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" keyTimes="0;0.2000" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="104" y="206" width="12" height="28" rx="2" fill="#22d3ee" opacity="0">
        <animate attributeName="x" values="104;626.4;626.4;104;104" keyTimes="0;0.0800;0.1600;0.1850;1" dur="20s" begin="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" keyTimes="0;0.2000" calcMode="discrete" dur="20s" begin="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="104" y="206" width="12" height="28" rx="2" fill="#22d3ee" opacity="0">
        <animate attributeName="x" values="104;568.8;568.8;104;104" keyTimes="0;0.0800;0.1600;0.1850;1" dur="20s" begin="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" keyTimes="0;0.2000" calcMode="discrete" dur="20s" begin="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="104" y="206" width="12" height="28" rx="2" fill="#22d3ee" opacity="0">
        <animate attributeName="x" values="104;511.2;511.2;104;104" keyTimes="0;0.0800;0.1600;0.1850;1" dur="20s" begin="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" keyTimes="0;0.2000" calcMode="discrete" dur="20s" begin="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="104" y="206" width="12" height="28" rx="2" fill="#22d3ee" opacity="0">
        <animate attributeName="x" values="104;540.0;540.0;104;104" keyTimes="0;0.0800;0.1600;0.1850;1" dur="20s" begin="16s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" keyTimes="0;0.2000" calcMode="discrete" dur="20s" begin="16s" repeatCount="indefinite"/>
      </rect>
  </g>
  <rect x="70" y="258" width="80" height="28" rx="14" fill="#111c33" stroke="#23324f"/><text x="110.0" y="277" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#9fb4d9">Laravel</text><rect x="160" y="258" width="48" height="28" rx="14" fill="#111c33" stroke="#23324f"/><text x="184.0" y="277" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#9fb4d9">PHP</text><rect x="218" y="258" width="80" height="28" rx="14" fill="#111c33" stroke="#23324f"/><text x="258.0" y="277" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#9fb4d9">Next.js</text><rect x="308" y="258" width="104" height="28" rx="14" fill="#111c33" stroke="#23324f"/><text x="360.0" y="277" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#9fb4d9">TypeScript</text><rect x="422" y="258" width="64" height="28" rx="14" fill="#111c33" stroke="#23324f"/><text x="454.0" y="277" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#9fb4d9">MySQL</text><rect x="496" y="258" width="72" height="28" rx="14" fill="#111c33" stroke="#23324f"/><text x="532.0" y="277" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#9fb4d9">Docker</text>

  <g transform="translate(1010 160)">
    <circle r="112" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="4 10" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle r="82" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="26 14" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="54" fill="#0d162b" stroke="#23324f" stroke-width="2"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/>
      <circle cx="112" cy="0" r="6" fill="#22d3ee"/>
      <circle cx="112" cy="0" r="12" fill="#22d3ee" opacity="0.25"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="180;-180" dur="12s" repeatCount="indefinite"/>
      <circle cx="82" cy="0" r="4" fill="#2f81f7"/>
    </g>
    <text y="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="32" font-weight="700" fill="url(#ring)">&lt;/&gt;</text>
  </g>
</svg>
