<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="Customer PWA: Customer portal for the workshop. Customers book a service, see promos, and check their service history across branches. Built with a teammate; I did the booking, promo, and dashboard pages plus a Python cache sync.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-600" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#eab308" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#eab308" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#eab308" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1200 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.08" cy="0.1" r="0.6"><stop offset="0" stop-color="#eab308" stop-opacity="0.22"/><stop offset="1" stop-color="#eab308" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="598" height="258" rx="16" fill="url(#bg)" stroke="#1f2a44" stroke-width="1.5"/>
  <rect x="1" y="1" width="598" height="258" rx="16" fill="url(#glow)"/>
  <rect x="1" y="1" width="598" height="258" rx="16" fill="none" stroke="url(#shine)" stroke-width="1.5"/>

  <rect x="32" y="30" width="44" height="44" rx="12" fill="#eab308" opacity="0.16"/>
  <rect x="32" y="30" width="44" height="44" rx="12" fill="none" stroke="#eab308" stroke-opacity="0.6"/>
  <text x="54" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#eab308">CP</text>
  <text x="92" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e5e7eb">Customer PWA</text>
  <text x="92" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">Customer portal for the workshop</text>

  <rect x="514" y="32" width="54" height="24" rx="12" fill="#082f49" stroke="#7dd3fc" stroke-opacity="0.35"/>
  <text x="541.0" y="48" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#7dd3fc">TEAM</text>

  <text x="32" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">Customers book a service, see promos, and check their service history</text><text x="32" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">across branches. Built with a teammate; I did the booking, promo, and</text><text x="32" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">dashboard pages plus a Python cache sync.</text>
  <rect x="32" y="206" width="68.4" height="26" rx="13" fill="#111c33" stroke="#23324f"/><text x="66.2" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9fb4d9">Laravel</text><rect x="107.4" y="206" width="54.0" height="26" rx="13" fill="#111c33" stroke="#23324f"/><text x="134.4" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9fb4d9">Blade</text><rect x="168.4" y="206" width="82.8" height="26" rx="13" fill="#111c33" stroke="#23324f"/><text x="209.8" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9fb4d9">Alpine.js</text><rect x="258.2" y="206" width="39.6" height="26" rx="13" fill="#111c33" stroke="#23324f"/><text x="278.0" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9fb4d9">PWA</text><rect x="304.8" y="206" width="54.0" height="26" rx="13" fill="#111c33" stroke="#23324f"/><text x="331.8" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9fb4d9">MySQL</text><rect x="365.8" y="206" width="61.2" height="26" rx="13" fill="#111c33" stroke="#23324f"/><text x="396.4" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9fb4d9">Python</text>
</svg>
