<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="FIT MOTOR AI Agent: WhatsApp CRM agent. Replies to customer chats on WhatsApp automatically, with an admin dashboard for settings and monitoring. Built with an external vendor; I worked on gateway reliability and deployment.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-600" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1200 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.08" cy="0.1" r="0.6"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="598" height="258" rx="16" fill="url(#bg)" stroke="#1f2a44" stroke-width="1.5"/>
  <rect x="1" y="1" width="598" height="258" rx="16" fill="url(#glow)"/>
  <rect x="1" y="1" width="598" height="258" rx="16" fill="none" stroke="url(#shine)" stroke-width="1.5"/>

  <rect x="32" y="30" width="44" height="44" rx="12" fill="#22d3ee" opacity="0.16"/>
  <rect x="32" y="30" width="44" height="44" rx="12" fill="none" stroke="#22d3ee" stroke-opacity="0.6"/>
  <text x="54" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#22d3ee">AI</text>
  <text x="92" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e5e7eb">FIT MOTOR AI Agent</text>
  <text x="92" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">WhatsApp CRM agent</text>

  <rect x="514" y="32" width="54" height="24" rx="12" fill="#082f49" stroke="#7dd3fc" stroke-opacity="0.35"/>
  <text x="541.0" y="48" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#7dd3fc">TEAM</text>

  <text x="32" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">Replies to customer chats on WhatsApp automatically, with an admin</text><text x="32" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">dashboard for settings and monitoring. Built with an external vendor;</text><text x="32" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">I worked on gateway reliability and deployment.</text>
  <rect x="32" y="206" width="46.8" height="26" rx="13" fill="#111c33" stroke="#23324f"/><text x="55.4" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9fb4d9">Hono</text><rect x="85.8" y="206" width="54.0" height="26" rx="13" fill="#111c33" stroke="#23324f"/><text x="112.8" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9fb4d9">Vue 3</text><rect x="146.8" y="206" width="90.0" height="26" rx="13" fill="#111c33" stroke="#23324f"/><text x="191.8" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9fb4d9">PostgreSQL</text><rect x="243.8" y="206" width="61.2" height="26" rx="13" fill="#111c33" stroke="#23324f"/><text x="274.4" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9fb4d9">BullMQ</text><rect x="312.0" y="206" width="54.0" height="26" rx="13" fill="#111c33" stroke="#23324f"/><text x="339.0" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9fb4d9">Redis</text><rect x="373.0" y="206" width="118.8" height="26" rx="13" fill="#111c33" stroke="#23324f"/><text x="432.4" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9fb4d9">GitHub Actions</text>
</svg>
